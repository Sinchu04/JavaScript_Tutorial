<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task 10 - Reverse String</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f4f7fc;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
}

.container{
    width:700px;
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 10px 25px rgba(0,0,0,.15);
}

h2{
    text-align:center;
    color:#0d6efd;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    margin-bottom:15px;
    font-size:16px;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#0d6efd;
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#084ec1;
}

.result{
    margin-top:20px;
    background:#f8f9fa;
    padding:20px;
    border-radius:10px;
    line-height:1.8;
}

.step{
    margin-bottom:15px;
}

strong{
    color:#0d6efd;
}

</style>

</head>

<body>

<div class="container">

<h2>Reverse String Function</h2>

<input
type="text"
id="inputString"
placeholder="Enter a string">

<button onclick="runDemo()">
Reverse String
</button>

<div
class="result"
id="result">
</div>

</div>

<script>

function reverseString(str){

    return str.split("").reverse().join("");

}

function runDemo(){

    let userInput=document.getElementById("inputString").value;

    let reversedUser=reverseString(userInput);

    console.log("User Input:",userInput);
    console.log("Reversed:",reversedUser);

    let test1="JavaScript";
    let test2="OpenAI";
    let test3="Hello World";

    let reverse1=reverseString(test1);
    let reverse2=reverseString(test2);
    let reverse3=reverseString(test3);

    console.log(test1,"=>",reverse1);
    console.log(test2,"=>",reverse2);
    console.log(test3,"=>",reverse3);

    document.getElementById("result").innerHTML=`

<div class="step">
<strong>User Input</strong><br>
${userInput}
</div>

<div class="step">
<strong>Reversed String</strong><br>
${reversedUser}
</div>

<hr><br>

<div class="step">
<strong>Test Case 1</strong><br>
Input : ${test1}<br>
Output : ${reverse1}
</div>

<div class="step">
<strong>Test Case 2</strong><br>
Input : ${test2}<br>
Output : ${reverse2}
</div>

<div class="step">
<strong>Test Case 3</strong><br>
Input : ${test3}<br>
Output : ${reverse3}
</div>

`;

}

</script>

</body>
</html>
