<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Task 12 - Promises & Async Await</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{

background:#f4f7fc;
padding:30px;

}

.container{

max-width:900px;
margin:auto;

}

h1{

text-align:center;
color:#0d6efd;
margin-bottom:25px;

}

button{

width:100%;
padding:12px;
background:#0d6efd;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
font-size:16px;
margin-bottom:25px;

}

button:hover{

background:#084ec1;

}

.card{

background:white;
padding:20px;
border-radius:12px;
margin-bottom:25px;
box-shadow:0 8px 20px rgba(0,0,0,.15);

}

h2{

color:#0d6efd;
margin-bottom:15px;

}

.output{

line-height:1.8;

}

</style>

</head>

<body>

<div class="container">

<h1>Promises & Async / Await</h1>

<button onclick="loadData()">

Load User Data

</button>

<div class="card">

<h2>Promise</h2>

<div id="promiseOutput" class="output"></div>

</div>

<div class="card">

<h2>Async / Await</h2>

<div id="asyncOutput" class="output"></div>

</div>

</div>

<script>

function promiseExample(){

fetch("https://jsonplaceholder.typicode.com/users/1")

.then(response=>response.json())

.then(data=>{

console.log("Promise",data);

document.getElementById("promiseOutput").innerHTML=`

<strong>Name:</strong> ${data.name}<br>

<strong>Username:</strong> ${data.username}<br>

<strong>Email:</strong> ${data.email}<br>

<strong>Phone:</strong> ${data.phone}<br>

<strong>Company:</strong> ${data.company.name}

`;

});

}

async function asyncExample(){

let response=await fetch("https://jsonplaceholder.typicode.com/users/1");

let data=await response.json();

console.log("Async Await",data);

document.getElementById("asyncOutput").innerHTML=`

<strong>Name:</strong> ${data.name}<br>

<strong>Username:</strong> ${data.username}<br>

<strong>Email:</strong> ${data.email}<br>

<strong>Phone:</strong> ${data.phone}<br>

<strong>Company:</strong> ${data.company.name}

`;

}

function loadData(){

promiseExample();

asyncExample();

}

</script>

</body>

</html>
