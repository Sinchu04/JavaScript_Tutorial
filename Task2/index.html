<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 2 - Rectangle Area Calculator</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#f4f7fc;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
            padding:20px;
        }

        .container{
            background:#fff;
            width:400px;
            padding:30px;
            border-radius:15px;
            box-shadow:0 10px 25px rgba(0,0,0,0.15);
            text-align:center;
        }

        h2{
            color:#0d6efd;
            margin-bottom:20px;
        }

        input{
            width:100%;
            padding:12px;
            margin:10px 0;
            border:1px solid #ccc;
            border-radius:8px;
            font-size:16px;
        }

        button{
            width:100%;
            padding:12px;
            margin-top:15px;
            border:none;
            border-radius:8px;
            background:#0d6efd;
            color:white;
            font-size:16px;
            cursor:pointer;
            transition:0.3s;
        }

        button:hover{
            background:#084ec1;
        }

        #result{
            margin-top:20px;
            font-size:18px;
            font-weight:bold;
            color:#333;
        }
    </style>
</head>
<body>

<div class="container">

    <h2>Rectangle Area Calculator</h2>

    <input type="number" id="length" placeholder="Enter Length">

    <input type="number" id="width" placeholder="Enter Width">

    <button onclick="calculateArea()">Calculate Area</button>

    <p id="result"></p>

</div>

<script>
    function calculateArea(){

        let length = Number(document.getElementById("length").value);
        let width = Number(document.getElementById("width").value);

        let area = length * width;

        document.getElementById("result").innerHTML =
        "Area of Rectangle = " + area;
    }
</script>

</body>
</html>
